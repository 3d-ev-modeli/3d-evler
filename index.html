<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { Reflector } from "three/addons/objects/Reflector.js";

const API =
  "https://api.github.com/repos/3d-ev-modeli/3d-evler";

const params = new URLSearchParams(location.search);

const file = params.get("model");
const villa = params.get("villa");

const viewer = document.getElementById("viewer");
const tour = document.getElementById("tour");
const panel = document.getElementById("panel");
const list = document.getElementById("list");
const floors = document.getElementById("floors");
const propertyTitle = document.getElementById("propertyTitle");
const status = document.getElementById("status");

let scene, camera, renderer, controls, ground;

let currentModel = null;
let loadID = 0;

let baseDistance = 10;
let cinematicTime = 0;
let resumeTimer = null;

let cinematicActive = false;
let interacting = false;
let transitionTime = 0;

const clock = new THREE.Clock();

function safeName(name) {

  return typeof name === "string" &&
    name.length > 0 &&
    name !== "." &&
    name !== ".." &&
    !name.includes("/") &&
    !name.includes("\\");

}

function isGLB(name) {

  return safeName(name) &&
    name.toLowerCase().endsWith(".glb");

}

function niceName(name) {

  return name
    .replace(/\.glb$/i, "")
    .replace(/^\d+[-_ ]+/, "")
    .replace(/[-_]+/g, " ")
    .replace(/\s+/g, " ")
    .replace(/(^|\s)\S/g,
      c => c.toLocaleUpperCase("tr"))
    .trim();

}

function parseTitle(name) {

  const clean = name
    .replace(/\.glb$/i, "")
    .trim();

  const match = clean.match(
    /^(\d+)\s*-\s*(.+)$/
  );

  if (!match) return null;

 const parts = match[2].split(/\s*-\s*/);

let location = parts[0].trim();
let details = parts.slice(1).join(" ").trim();

if (parts.length >= 3) {
  location = parts.slice(0, 2).join(" - ");
  details = parts.slice(2).join(" ").trim();
} else {
  location = location.replace(/^(\S+)\s+(.+)$/, "$1 - $2");
}

return {
  ref: match[1],
  location: location,
  details: details
};
}

function showTitle(name) {

  propertyTitle.replaceChildren();

  const data = parseTitle(name);

  if (data) {

    const ref = document.createElement("div");

    ref.className = "ref";
    ref.textContent = "Ref: " + data.ref;

    propertyTitle.appendChild(ref);

    const location = document.createElement("div");

    location.textContent = data.location.toLocaleUpperCase("tr-TR");

    propertyTitle.appendChild(location);

    if (data.details) {

      const details = document.createElement("div");

      details.textContent = niceName(data.details);

      propertyTitle.appendChild(details);

    }

  } else {

    propertyTitle.textContent = niceName(name);

  }

  propertyTitle.hidden = false;

}

function compareNames(a, b) {

  return a.localeCompare(b, "tr", {
    numeric: true,
    sensitivity: "base"
  });

}

async function getJSON(url) {

  const response = await fetch(url);

  if (!response.ok) throw new Error("API");

  return response.json();

}

function modelPath(folder, name) {

  if (folder) {

    return "./" +
      encodeURIComponent(folder) + "/" +
      encodeURIComponent(name);

  }

  return "./" + encodeURIComponent(name);

}

function showStatus(message) {

  status.textContent = message;
  status.hidden = false;

}

function resizeViewer() {

  if (!renderer) return;

  const width = Math.max(viewer.clientWidth, 1);
  const height = Math.max(viewer.clientHeight, 1);

  camera.aspect = width / height;
  camera.updateProjectionMatrix();

  renderer.setSize(width, height);

}

function pauseCinematic() {

  clearTimeout(resumeTimer);

  cinematicActive = false;

  if (controls) {

    controls.autoRotate = false;

  }

}

function scheduleResume() {

  clearTimeout(resumeTimer);

  resumeTimer = setTimeout(() => {

    if (currentModel && !interacting) {

      cinematicActive = true;
      transitionTime = 0;

    }

  }, 5000);

}

function initViewer() {

  if (renderer) return;

  scene = new THREE.Scene();

  scene.background = new THREE.Color(0xffffff);

  camera = new THREE.PerspectiveCamera(
    40, 1, 0.01, 200
  );

  camera.position.set(0, 10, 10);

  renderer = new THREE.WebGLRenderer({
    antialias: true
  });

  renderer.setPixelRatio(
    Math.min(devicePixelRatio, 2)
  );

  renderer.shadowMap.enabled = true;

  renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

  viewer.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(
    0xffffff, 0xaaaaaa, 1.8
  ));

  const light = new THREE.DirectionalLight(
    0xffffff, 2
  );

  light.position.set(5, 10, 5);
  light.castShadow = true;
  light.shadow.mapSize.set(2048, 2048);
  light.shadow.normalBias = 0.02;
  light.shadow.intensity = 0.55;

  scene.add(light);

  const fillLight = new THREE.DirectionalLight(0xffffff, 0.5);
  fillLight.position.set(-5, 6, -5);
  scene.add(fillLight);

  ground = new Reflector(
    new THREE.PlaneGeometry(200, 200),
    {
      color: 0xffffff,
      textureWidth: 2048,
      textureHeight: 2048
    }
  );

  ground.rotation.x = -Math.PI / 2;

  scene.add(ground);

  ground.material.fragmentShader =
    ground.material.fragmentShader.replace(
      "blendOverlay( base.rgb, color )",
      "mix(vec3(0.96), base.rgb, 0.13)"
    );

  ground.material.needsUpdate = true;

  controls = new OrbitControls(
    camera, renderer.domElement
  );

  controls.enableDamping = true;
  controls.dampingFactor = 0.06;

  controls.autoRotate = false;

  controls.maxPolarAngle =
    Math.PI / 2 - 0.02;

  controls.addEventListener("start", () => {

    interacting = true;

    pauseCinematic();

  });

  controls.addEventListener("end", () => {

    interacting = false;

    scheduleResume();

  });

  renderer.domElement.addEventListener(
    "pointerdown", () => {

      interacting = true;

      pauseCinematic();

    }
  );

  window.addEventListener(
    "pointerup", () => {

      if (!interacting) return;

      interacting = false;

      scheduleResume();

    }
  );

  window.addEventListener(
    "pointercancel", () => {

      if (!interacting) return;

      interacting = false;

      scheduleResume();

    }
  );

  new ResizeObserver(resizeViewer)
    .observe(viewer);

  resizeViewer();

  animate();

}

function animate() {

  requestAnimationFrame(animate);

  const delta = Math.min(
    clock.getDelta(), 0.1
  );

  if (cinematicActive && currentModel) {

    cinematicTime += delta;
    transitionTime += delta;

    const orbit = new THREE.Spherical();

    orbit.setFromVector3(
      camera.position.clone()
        .sub(controls.target)
    );

    const phase =
      cinematicTime * Math.PI * 2 / 30;

    const desiredAngle =
      THREE.MathUtils.degToRad(
        45 + 15 * Math.sin(phase)
      );

    const desiredDistance =
      baseDistance *
      (1 - 0.12 * (1 - Math.cos(phase)) / 2);

    const smooth =
      1 - Math.exp(-delta * 1.5);

    const ramp = Math.min(
      transitionTime / 1.5, 1
    );

    orbit.theta -=
      delta * Math.PI * 2 / 30 * ramp;

    orbit.phi = THREE.MathUtils.lerp(
      orbit.phi,
      desiredAngle,
      smooth
    );

    orbit.radius = THREE.MathUtils.lerp(
      orbit.radius,
      desiredDistance,
      smooth
    );

    camera.position.setFromSpherical(orbit);

    camera.position.add(controls.target);

  }

  controls.update();

  renderer.render(scene, camera);

}

function hideMeasurements(model) {

  model.traverse(obj => {

    if (!obj.isMesh || !obj.material) return;

    const m = obj.material;

    if (!m.color || m.map) return;

    const c = m.color;

    const gray =
      Math.abs(c.r - 1/3) < 0.001 &&
      Math.abs(c.g - 1/3) < 0.001 &&
      Math.abs(c.b - 1/3) < 0.001;

    const white =
      Math.abs(c.r - 1) < 0.001 &&
      Math.abs(c.g - 1) < 0.001 &&
      Math.abs(c.b - 1) < 0.001;

    if (
      (gray || white) &&
      m.metalness === 0 &&
      m.roughness === 0.5 &&
      m.side === THREE.DoubleSide &&
      !m.transmission
    ) {

      obj.visible = false;

    }

  });

}

function disposeModel(model) {

  const geometries = new Set();
  const materials = new Set();
  const textures = new Set();

  model.traverse(obj => {

    if (!obj.isMesh) return;

    if (obj.geometry) {

      geometries.add(obj.geometry);

    }

    const mats = Array.isArray(obj.material)
      ? obj.material
      : [obj.material];

    mats.forEach(m => {

      if (!m) return;

      materials.add(m);

      Object.values(m).forEach(value => {

        if (value && value.isTexture) {

          textures.add(value);

        }

      });

    });

  });

  geometries.forEach(g => g.dispose());
  textures.forEach(t => t.dispose());
  materials.forEach(m => m.dispose());

}

function openModel(folder, name) {

  initViewer();

  const requestID = ++loadID;

  pauseCinematic();

  interacting = false;

  showStatus("3D model yükleniyor...");

  if (currentModel) {

    scene.remove(currentModel);

    disposeModel(currentModel);

    currentModel = null;

  }

  new GLTFLoader().load(

    modelPath(folder, name),

    gltf => {

      if (requestID !== loadID) {

        disposeModel(gltf.scene);

        return;

      }

      const model = gltf.scene;

      hideMeasurements(model);

      model.traverse(obj => {
        if (obj.isMesh && !obj.name.startsWith("styledPlanOverlay")) {
          obj.castShadow = true;
          obj.receiveShadow = true;
        }
      });
      
model.traverse(obj => {

  if (!obj.isMesh || !obj.material) return;

  if (!obj.name.startsWith("styledPlanOverlay")) return;

  const map = obj.material.map;

  if (!map || !map.image) return;

  const img = map.image;

  // Oda isimlerini gizle
  if (img.height === 63 && img.width >= 100) {
    obj.visible = false;
    return;
  }

  // Ölçü yazılarındaki beyaz konturu gri yap
  if (img.width > 500 && img.height > 500) {

    const canvas = document.createElement("canvas");

    canvas.width = img.width;
    canvas.height = img.height;

    const ctx = canvas.getContext("2d");

    ctx.drawImage(img, 0, 0);

    const pixels = ctx.getImageData(
      0, 0, canvas.width, canvas.height
    );

    const data = pixels.data;

    for (let i = 0; i < data.length; i += 4) {

      if (
        data[i] > 220 &&
        data[i + 1] > 220 &&
        data[i + 2] > 220
      ) {
        data[i] = 208;
        data[i + 1] = 208;
        data[i + 2] = 208;
      }

    }

    ctx.putImageData(pixels, 0, 0);

    const texture = new THREE.CanvasTexture(canvas);

    texture.colorSpace = map.colorSpace;
    texture.flipY = map.flipY;

    obj.material = obj.material.clone();
    obj.material.map = texture;
    obj.material.needsUpdate = true;

  }

});


      const box = new THREE.Box3()
        .setFromObject(model);

      const center = box.getCenter(
        new THREE.Vector3()
      );

      const size = box.getSize(
        new THREE.Vector3()
      );

      model.position.x -= center.x;
      model.position.z -= center.z;
      model.position.y -= box.min.y;

      model.position.y += 0.01;

      scene.add(model);
      ground.visible = !(folder && /zemin/i.test(name));
      if (folder && /zemin/i.test(name)) {

  const garden = new THREE.Group();

  const s = Math.max(size.x, size.z);

  const grass = new THREE.Mesh(
    new THREE.BoxGeometry(
      size.x + s * 0.28,
      s * 0.015,
      size.z + s * 0.28
    ),
new THREE.MeshBasicMaterial({
  color: 0x78965b
})
  );

grass.position.y = -s * 0.0075 - 0.005;
 grass.receiveShadow = false;
grass.material.polygonOffset = true;
grass.material.polygonOffsetFactor = -4;
grass.material.polygonOffsetUnits = -4;
  garden.add(grass);

  function addTree(x, z) {

    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(
        s * 0.009, s * 0.013,
        s * 0.12, 12
      ),
      new THREE.MeshStandardMaterial({
        color: 0x79583b
      })
    );

    trunk.position.set(x, s * 0.06, z);
    trunk.castShadow = true;
    garden.add(trunk);

    const crown = new THREE.Mesh(
      new THREE.IcosahedronGeometry(
        s * 0.065, 3
      ),
      new THREE.MeshStandardMaterial({
        color: 0x426b32,
        roughness: 1
      })
    );

    crown.position.set(x, s * 0.16, z);
    crown.castShadow = true;
    crown.receiveShadow = true;
    garden.add(crown);

  }

  addTree(
    -size.x / 2 - s * 0.07,
    size.z * 0.32
  );

  addTree(
    size.x / 2 + s * 0.07,
    -size.z * 0.32
  );
for (let i = 0; i < 5; i++) {
  const bush = new THREE.Mesh(
    new THREE.IcosahedronGeometry(s * 0.025, 2),
    new THREE.MeshStandardMaterial({
      color: 0x587b38,
      roughness: 1
    })
  );

  bush.position.set(
    size.x * (-0.4 + i * 0.2),
    s * 0.02,
    size.z / 2 + s * 0.07
  );

  bush.scale.y = 0.8;
  bush.castShadow = true;
  garden.add(bush);
}
  model.updateMatrixWorld(true);
  scene.add(garden);
  model.attach(garden);

}

      currentModel = model;

      status.hidden = true;

      resizeViewer();

      const d = Math.max(
        size.x, size.y, size.z, 0.1
      );

      const fit = Math.max(
        1, 0.85 / camera.aspect
      );

      const radius = size.length() / 2;

      const verticalFov =
        THREE.MathUtils.degToRad(camera.fov);

      const horizontalFov = 2 * Math.atan(
        Math.tan(verticalFov / 2) *
        camera.aspect
      );

      const limitingFov = Math.min(
        verticalFov,
        horizontalFov
      );

      baseDistance = Math.max(

        d * 1.6 * Math.SQRT2 * fit,

        radius /
        Math.sin(limitingFov / 2) * 1.15

      );

      const h = baseDistance / Math.SQRT2;

      controls.target.set(
        0, size.y / 2, 0
      );

      camera.position.set(
        0,
        size.y / 2 + h,
        h
      );

      camera.near = Math.max(
        d / 1000, 0.001
      );

      camera.far = Math.max(
        200, baseDistance * 10
      );

      camera.updateProjectionMatrix();

      controls.minDistance = d * 0.15;

      controls.maxDistance =
        baseDistance * 4;

      controls.update();

      clearTimeout(resumeTimer);

      cinematicTime = 0;

      transitionTime = 1.5;

      cinematicActive = true;

    },

    undefined,

    () => {

      if (requestID === loadID) {

        showStatus(
          "3D model yüklenemedi. Lütfen tekrar deneyin."
        );

      }

    }

  );

}

async function openVilla(folder) {

  tour.hidden = false;

  showTitle(folder);

  showStatus("Katlar yükleniyor...");

  try {

    const files = await getJSON(

      API + "/contents/" +

      encodeURIComponent(folder) +

      "?ref=main"

    );

    const models = files

      .filter(f =>
        f.type === "file" && isGLB(f.name)
      )

      .sort((a, b) =>
        compareNames(a.name, b.name)
      );

    if (!models.length) {

      showStatus(
        "Bu gayrimenkulde henüz model bulunmuyor."
      );

      return;

    }

    if (models.length > 1) {

      floors.hidden = false;

      models.forEach((model, index) => {

        const button =
          document.createElement("button");

        button.className = "floor-button";

        button.textContent =
          niceName(model.name);

        if (index === 0) {

          button.classList.add("active");

        }

        button.onclick = () => {

          if (
            button.classList.contains("active")
          ) return;

          floors.querySelectorAll("button")
            .forEach(b => {

              b.classList.remove("active");

            });

          button.classList.add("active");

          openModel(folder, model.name);

        };

        floors.appendChild(button);

      });

    }

    openModel(folder, models[0].name);

  } catch {

    showStatus(
      "Katlar alınamadı. Lütfen sayfayı yenileyin."
    );

  }

}

function createItem(name, type, count) {

  const url = new URL("./", location.href);
  url.searchParams.set("v", "17005");

  if (type === "villa") {

    url.searchParams.set("villa", name);

  } else {

    url.searchParams.set("model", name);

  }

  const item = document.createElement("div");

  item.className = "item";

  const title = document.createElement("strong");

  const refMatch = name.match(
    /^(\d+)\s*-\s*/
  );

  if (refMatch) {

    const ref = document.createElement("span");

    ref.className = "ref";

    ref.textContent =
      "Ref: " + refMatch[1] + " ";

    title.appendChild(ref);

    title.appendChild(
      document.createTextNode(niceName(name))
    );

  } else {

    title.textContent = niceName(name);

  }

  const info = document.createElement("div");

  info.className = "info";

  info.textContent = count > 1
    ? count + " kat"
    : "Tek kat";

  const open = document.createElement("a");

  open.className = "open";
  open.href = url.href;
  open.target = "_blank";
  open.rel = "noopener";
  open.textContent = "Görüntüle";

  const copy = document.createElement("button");

  copy.textContent = "Bağlantıyı kopyala";

  copy.onclick = async () => {

    try {

      await navigator.clipboard.writeText(url.href);

      copy.textContent = "Kopyalandı ✓";

      setTimeout(() => {

        copy.textContent = "Bağlantıyı kopyala";

      }, 2000);

    } catch {

      prompt("Bağlantıyı kopyalayın:", url.href);

    }

  };

  item.append(title, info, open, copy);

  list.appendChild(item);

}

async function loadModels() {

  try {

    const data = await getJSON(

      API + "/git/trees/main?recursive=1"

    );

    if (data.truncated) {

      throw new Error("Liste");

    }

    const rootModels = [];
    const villas = new Map();

    data.tree.forEach(entry => {

      if (entry.type !== "blob") return;

      const parts = entry.path.split("/");

      if (

        parts.length === 1 &&

        isGLB(parts[0])

      ) {

        rootModels.push(parts[0]);

      }

      if (

        parts.length === 2 &&

        safeName(parts[0]) &&

        isGLB(parts[1])

      ) {

        const folder = parts[0];

        if (!villas.has(folder)) {

          villas.set(folder, []);

        }

        villas.get(folder).push(parts[1]);

      }

    });

    list.textContent = "";

    const items = [

      ...rootModels.map(name => ({

        name,

        type: "model",

        count: 1

      })),

      ...Array.from(villas.entries())
        .map(([name, models]) => ({

          name,

          type: "villa",

          count: models.length

        }))

    ];

    items.sort((a, b) =>

      compareNames(a.name, b.name)

    );

    items.forEach(item => {

      createItem(
        item.name,
        item.type,
        item.count
      );

    });

    if (!items.length) {

      list.textContent =
        "Henüz model yüklenmemiş.";

    }

  } catch {

    list.textContent =
      "Modeller alınamadı. Lütfen daha sonra sayfayı yenileyin.";

  }

}

if (file && isGLB(file)) {

  tour.hidden = false;

  showTitle(file);

  openModel(null, file);

} else if (villa && safeName(villa)) {

  openVilla(villa);

} else {

  panel.hidden = false;

  loadModels();

}

</script>
