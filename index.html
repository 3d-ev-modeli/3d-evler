
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Ev Turu</title>

<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f6f8;
}

model-viewer {
  width: 100%;
  height: 100%;
  background: white;
}

#tour {
  height: 100dvh;
  display: flex;
  flex-direction: column;
  background: white;
}

#viewer {
  flex: 1;
  min-height: 0;
}

#floors {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  padding: 12px;
  background: #f5f6f8;
  border-bottom: 1px solid #ddd;
}

#propertyTitle {
  text-align: center;
  padding: 14px;
  font-size: 18px;
  font-weight: bold;
  background: white;
}

#panel {
  max-width: 850px;
  margin: 40px auto;
  padding: 20px;
}

.item {
  background: white;
  padding: 20px;
  margin-bottom: 12px;
  border-radius: 10px;
  border: 1px solid #ddd;
}

button, .open {
  display: inline-block;
  background: #176b43;
  color: white;
  padding: 12px 16px;
  border: 0;
  border-radius: 6px;
  margin: 12px 8px 0 0;
  cursor: pointer;
  text-decoration: none;
  font-size: 14px;
}

.open {
  background: #333;
}

.floor-button {
  background: #e5e7eb;
  color: #333;
  margin: 0;
}

.floor-button.active {
  background: #176b43;
  color: white;
}

.info {
  color: #777;
  font-size: 13px;
  margin-top: 8px;
}

#status {
  padding: 15px;
  text-align: center;
  color: #555;
}

[hidden] {
  display: none !important;
}
</style>
</head>

<body>

<div id="tour" hidden>

  <div id="propertyTitle" hidden></div>

  <div id="floors" hidden></div>

  <div id="status" hidden></div>

  <model-viewer
    id="viewer"
    camera-controls
    touch-action="pan-y"
    auto-rotate
    shadow-intensity="0.5">
  </model-viewer>

</div>

<div id="panel" hidden>
  <h1>3D Ev Modelleri</h1>
  <p>Görüntülemek veya paylaşmak istediğiniz modeli seçin.</p>
  <div id="list">Modeller yükleniyor...</div>
</div>

<script>

const API =
  "https://api.github.com/repos/3d-ev-modeli/3d-evler";

const params = new URLSearchParams(location.search);

const file = params.get("model");
const villa = params.get("villa");

const viewer = document.getElementById("viewer");
const tour = document.getElementById("tour");
const panel = document.getElementById("panel");
const list = document.getElementById("list");
const floors = document.getElementById("floors");
const propertyTitle = document.getElementById("propertyTitle");
const status = document.getElementById("status");

function safeName(name) {
  return typeof name === "string" &&
    name.length > 0 &&
    name !== "." &&
    name !== ".." &&
    !name.includes("/") &&
    !name.includes("\\");
}

function isGLB(name) {
  return safeName(name) &&
    name.toLowerCase().endsWith(".glb");
}

function niceName(name) {
  return name
    .replace(/\.glb$/i, "")
    .replace(/^\d+[-_ ]+/, "")
    .replace(/[-_]+/g, " ")
    .replace(/(^|\s)\S/g, c => c.toLocaleUpperCase("tr"));
}

function compareNames(a, b) {
  return a.localeCompare(b, "tr", {
    numeric: true,
    sensitivity: "base"
  });
}

async function getJSON(url) {
  const response = await fetch(url);
  if (!response.ok) throw new Error("API");
  return response.json();
}

function modelPath(folder, name) {
  if (folder) {
    return "./" +
      encodeURIComponent(folder) + "/" +
      encodeURIComponent(name);
  }

  return "./" + encodeURIComponent(name);
}

function showStatus(message) {
  status.textContent = message;
  status.hidden = false;
}

viewer.addEventListener("load", () => {
  status.hidden = true;
});

viewer.addEventListener("error", () => {
  showStatus("3D model yüklenemedi. Lütfen tekrar deneyin.");
});

function openModel(folder, name) {
  showStatus("3D model yükleniyor...");
  viewer.src = modelPath(folder, name);
}

async function openVilla(folder) {

  tour.hidden = false;
  showStatus("Katlar yükleniyor...");

  try {

    const files = await getJSON(
      API + "/contents/" +
      encodeURIComponent(folder) +
      "?ref=main"
    );

    const models = files
      .filter(f => f.type === "file" && isGLB(f.name))
      .sort((a, b) => compareNames(a.name, b.name));

    if (!models.length) {
      showStatus("Bu gayrimenkulde henüz model bulunmuyor.");
      return;
    }

    propertyTitle.textContent = niceName(folder);
    propertyTitle.hidden = false;

    if (models.length > 1) {

      floors.hidden = false;

      models.forEach((model, index) => {

        const button = document.createElement("button");

        button.className = "floor-button";
        button.textContent = niceName(model.name);

        if (index === 0) {
          button.classList.add("active");
        }

        button.onclick = () => {

          if (button.classList.contains("active")) return;

          floors.querySelectorAll("button").forEach(b => {
            b.classList.remove("active");
          });

          button.classList.add("active");

          openModel(folder, model.name);
        };

        floors.appendChild(button);

      });
    }

    openModel(folder, models[0].name);

  } catch {
    showStatus("Katlar alınamadı. Lütfen sayfayı yenileyin.");
  }
}

function createItem(name, type, count) {

  const url = new URL("./", location.href);

  if (type === "villa") {
    url.searchParams.set("villa", name);
  } else {
    url.searchParams.set("model", name);
  }

  const item = document.createElement("div");
  item.className = "item";

  const title = document.createElement("strong");
  title.textContent = niceName(name);

  const info = document.createElement("div");
  info.className = "info";

  info.textContent = count > 1
    ? count + " kat"
    : "Tek kat";

  const open = document.createElement("a");
  open.className = "open";
  open.href = url.href;
  open.target = "_blank";
  open.rel = "noopener";
  open.textContent = "Görüntüle";

  const copy = document.createElement("button");
  copy.textContent = "Bağlantıyı kopyala";

  copy.onclick = async () => {

    try {

      await navigator.clipboard.writeText(url.href);

      copy.textContent = "Kopyalandı ✓";

      setTimeout(() => {
        copy.textContent = "Bağlantıyı kopyala";
      }, 2000);

    } catch {
      prompt("Bağlantıyı kopyalayın:", url.href);
    }

  };

  item.append(title, info, open, copy);
  list.appendChild(item);
}

async function loadModels() {

  try {

    const data = await getJSON(
      API + "/git/trees/main?recursive=1"
    );

    if (data.truncated) throw new Error("Liste");

    const rootModels = [];
    const villas = new Map();

    data.tree.forEach(entry => {

      if (entry.type !== "blob") return;

      const parts = entry.path.split("/");

      if (
        parts.length === 1 &&
        isGLB(parts[0])
      ) {
        rootModels.push(parts[0]);
      }

      if (
        parts.length === 2 &&
        safeName(parts[0]) &&
        isGLB(parts[1])
      ) {

        const folder = parts[0];

        if (!villas.has(folder)) {
          villas.set(folder, []);
        }

        villas.get(folder).push(parts[1]);
      }

    });

    list.textContent = "";

    const items = [

      ...rootModels.map(name => ({
        name,
        type: "model",
        count: 1
      })),

      ...Array.from(villas.entries()).map(([name, models]) => ({
        name,
        type: "villa",
        count: models.length
      }))

    ];

    items.sort((a, b) => compareNames(a.name, b.name));

    items.forEach(item => {
      createItem(item.name, item.type, item.count);
    });

    if (!items.length) {
      list.textContent = "Henüz model yüklenmemiş.";
    }

  } catch {

    list.textContent =
      "Modeller alınamadı. Lütfen daha sonra sayfayı yenileyin.";

  }
}

if (file && isGLB(file)) {

  tour.hidden = false;
  openModel(null, file);

} else if (villa && safeName(villa)) {

  openVilla(villa);

} else {

  panel.hidden = false;
  loadModels();

}

</script>

</body>
</html>
