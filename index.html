
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Ev Turu</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f6f8;
}
model-viewer {
  width: 100%;
  height: 100dvh;
  background: white;
}
#panel {
  max-width: 850px;
  margin: 40px auto;
  padding: 20px;
}
.item {
  background: white;
  padding: 20px;
  margin-bottom: 12px;
  border-radius: 10px;
  border: 1px solid #ddd;
}
button, .open {
  display: inline-block;
  background: #176b43;
  color: white;
  padding: 12px 16px;
  border: 0;
  border-radius: 6px;
  margin: 12px 8px 0 0;
  cursor: pointer;
  text-decoration: none;
  font-size: 14px;
}
.open {
  background: #333;
}
[hidden] {
  display: none !important;
}
</style>
</head>
<body>

<model-viewer id="viewer" hidden camera-controls touch-action="pan-y" auto-rotate shadow-intensity="0.5"></model-viewer>

<div id="panel" hidden>
  <h1>3D Ev Modelleri</h1>
  <p>Görüntülemek veya paylaşmak istediğiniz modeli seçin.</p>
  <div id="list">Modeller yükleniyor...</div>
</div>

<script>
const file = new URLSearchParams(location.search).get("model");
const viewer = document.getElementById("viewer");
const panel = document.getElementById("panel");
const list = document.getElementById("list");

if (file && file.toLowerCase().endsWith(".glb") &&
    !file.includes("/") && !file.includes("\\")) {
  viewer.hidden = false;
  viewer.src = "./" + encodeURIComponent(file);
} else {
  panel.hidden = false;
  loadModels();
}

async function loadModels() {
  try {
    const response = await fetch(
      "https://api.github.com/repos/muratkahveci73-ops/3d-evler/contents/?ref=main",
      { cache: "no-store" }
    );
    if (!response.ok) throw new Error("API");
    const files = await response.json();
    const models = files.filter(f =>
      f.type === "file" &&
      f.name.toLowerCase().endsWith(".glb")
    );

    list.textContent = "";

    if (!models.length) {
      list.textContent = "Henüz model yüklenmemiş.";
    }

    models.forEach(model => {
      const url = new URL("./", location.href);
      url.search = "?model=" + encodeURIComponent(model.name);

      const item = document.createElement("div");
      item.className = "item";

      const name = document.createElement("strong");
      name.textContent = model.name.replace(/\.glb$/i, "");

      const open = document.createElement("a");
      open.className = "open";
      open.href = url.href;
      open.target = "_blank";
      open.rel = "noopener";
      open.textContent = "Görüntüle";

      const copy = document.createElement("button");
      copy.textContent = "Bağlantıyı kopyala";
      copy.onclick = async () => {
        try {
          await navigator.clipboard.writeText(url.href);
          copy.textContent = "Kopyalandı ✓";
          setTimeout(() => {
            copy.textContent = "Bağlantıyı kopyala";
          }, 2000);
        } catch {
          prompt("Bağlantıyı kopyalayın:", url.href);
        }
      };

      item.append(name, document.createElement("br"), open, copy);
      list.appendChild(item);
    });
  } catch {
    list.textContent =
      "Modeller alınamadı. Lütfen daha sonra sayfayı yenileyin.";
  }
}
</script>

</body>
</html>
