
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Yansıma Testi</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: white;
}
canvas {
  display: block;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { Reflector } from "three/addons/objects/Reflector.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);

const camera = new THREE.PerspectiveCamera(
  40, innerWidth / innerHeight, 0.01, 200
);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(
 0xffffff, 0xaaaaaa, 2.8
));

const light = new THREE.DirectionalLight(
  0xffffff, 2
);

light.position.set(5, 10, 5);
light.castShadow = true;
scene.add(light);

const ground = new Reflector(
  new THREE.PlaneGeometry(200, 200),
  {
    color: 0xffffff,
    textureWidth: 256,
    textureHeight: 256
  }
);

ground.rotation.x = -Math.PI / 2;
scene.add(ground);
  
const shadowCanvas = document.createElement("canvas");
shadowCanvas.width = shadowCanvas.height = 256;

const ctx = shadowCanvas.getContext("2d");
const gradient = ctx.createRadialGradient(
  128, 128, 15, 128, 128, 128
);

gradient.addColorStop(0, "rgba(0,0,0,0.25)");
gradient.addColorStop(0.5, "rgba(0,0,0,0.12)");
gradient.addColorStop(1, "rgba(0,0,0,0)");

ctx.fillStyle = gradient;
ctx.fillRect(0, 0, 256, 256);

const contactShadow = new THREE.Mesh(
  new THREE.PlaneGeometry(1, 1),
  new THREE.MeshBasicMaterial({
    map: new THREE.CanvasTexture(shadowCanvas),
    transparent: true,
    depthWrite: false
  })
);

contactShadow.rotation.x = -Math.PI / 2;
contactShadow.position.y = 0.002;
scene.add(contactShadow);


ground.material.fragmentShader =
  ground.material.fragmentShader.replace(
    "blendOverlay( base.rgb, color )",
    "mix(vec3(0.96), base.rgb, 0.13)"
  );

const controls = new OrbitControls(
  camera, renderer.domElement
);

controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 2;

controls.addEventListener("start", () => {
  controls.autoRotate = false;
});

const params = new URLSearchParams(location.search);
const file = params.get("model") || "Your_First_Scan.glb";

new GLTFLoader().load(
  "./" + encodeURIComponent(file),

  gltf => {

    const model = gltf.scene;

    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    
contactShadow.scale.set(
  size.x * 1.5,
  size.z * 1.5,
  1
);


    model.position.x -= center.x;
    model.position.z -= center.z;
    model.position.y -= box.min.y;
    model.position.y += 0.01;

    scene.add(model);

    const d = Math.max(size.x, size.y, size.z);

    camera.position.set(0, d * 1.6, d * 1.6);
    controls.target.set(0, size.y / 2, 0);
    controls.update();

  },

  undefined,

  () => alert("Model yüklenemedi.")
);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>
