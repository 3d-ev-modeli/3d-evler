name: 064v WhatsApp preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/whatsapp-preview-064v.yml']
concurrency:
  group: portfolio-pages-main
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: preview-064v
          run-id: 46168012441
          github-token: ${{ github.token }}
          path: _preview
      - name: Read approved development viewer and live catalog
        env:
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          PORTFOLIO_DRIVE_FILE_ID: ${{ secrets.PORTFOLIO_DRIVE_FILE_ID }}
        run: |
          git fetch --depth=1 origin portfolio-price-location
          mkdir -p "$RUNNER_TEMP/preview-tools"
          git show FETCH_HEAD:program/tools/video_links.py > "$RUNNER_TEMP/preview-tools/video_links.py"
          git show FETCH_HEAD:program/tools/drive_import.py > "$RUNNER_TEMP/preview-tools/drive_import.py"
          git show FETCH_HEAD:program/index.html > program/test-viewer-064v-3kat.html
          python -m pip install -r program/tools/requirements.txt
          PYTHONPATH="$RUNNER_TEMP/preview-tools" python - <<'PY'
          import json, os
          from pathlib import Path
          from drive_import import Drive
          from video_links import read_drive_catalog
          catalog = read_drive_catalog(Drive(os.environ["GOOGLE_DRIVE_API_KEY"]), ".")
          assert all(catalog.get(field, {}).get("64v") for field in ("prices","locations","details","videos"))
          payload = {"version": 1, **{field: {"64v": catalog[field]["64v"]} for field in ("prices","locations","details","videos")}}
          Path("program/config/test-links-064v.json").write_text(json.dumps(payload, ensure_ascii=False), encoding="utf-8")
          viewer = Path("program/test-viewer-064v-3kat.html")
          html = viewer.read_text(encoding="utf-8")
          assert "./config/video-links.json" in html
          viewer.write_text(html.replace("./config/video-links.json", "./config/test-links-064v.json"), encoding="utf-8")
          PY
      - name: Prepare browser-compatible video for isolated 064v test
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse, re, shutil
          from pathlib import Path
          p=Path("program/config/test-links-064v.json")
          config=json.loads(p.read_text())
          u=urllib.parse.urlsplit(config["videos"]["64v"])
          match=re.search(r"/file/d/([\w-]+)",u.path)
          query={"id":match[1] if match else urllib.parse.parse_qs(u.query)["id"][0],"export":"download","confirm":"t"}
          key=urllib.parse.parse_qs(u.query).get("resourcekey")
          if key: query["resourcekey"]=key[0]
          req=urllib.request.Request("https://drive.usercontent.google.com/download?"+urllib.parse.urlencode(query),headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req,timeout=120) as res, open("_preview/source.mp4","wb") as out:
              assert res.headers.get("Content-Type","").startswith("video/")
              shutil.copyfileobj(res,out)
          assert Path("_preview/source.mp4").stat().st_size > 1000000
          PY
          mkdir -p program/test-media
          ffmpeg -hide_banner -loglevel error -y -i _preview/source.mp4 -vf "scale=720:1280:force_original_aspect_ratio=decrease:force_divisible_by=2" -c:v libx264 -pix_fmt yuv420p -preset fast -crf 22 -maxrate 4M -bufsize 8M -c:a aac -b:a 128k -movflags +faststart program/test-media/064v.mp4
          test "$(stat -c%s program/test-media/064v.mp4)" -lt 95000000
          ffprobe -v error -show_entries stream=codec_name,pix_fmt,width,height -of compact program/test-media/064v.mp4
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("program/config/test-links-064v.json")
          data=json.loads(p.read_text())
          data["videos"]["64v"]="https://3d-ev-modeli.github.io/3d-evler/program/test-media/064v.mp4"
          p.write_text(json.dumps(data,ensure_ascii=False))
          v=Path("program/test-viewer-064v-3kat.html")
          s=v.read_text()
          s=s.replace('Portföy videosu</span><button id="videoClose"','Portföy videosu · Test 3</span><button id="videoClose"')
          v.write_text(s)
          PY
      - name: Prepare site and isolated preview
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          target = Path("program/share")
          target.mkdir(parents=True, exist_ok=True)
          name = "test-064v-3kat"
          shutil.copyfile("_preview/preview-064v.jpg", target / (name + ".jpg"))
          base = "https://3d-ev-modeli.github.io/3d-evler/program/share/"
          html = Path("program/share/ref-064v.html").read_text(encoding="utf-8")
          html = html.replace(base + "ref-064v.html?v=f3636f5f11c8", base + name + ".html")
          html = html.replace("https://3d-ev-modeli.github.io/3d-evler/program/covers/064v-f3636f5f11c8.jpg", base + name + ".jpg")
          html = html.replace("../?villa=ref-064v", "../test-viewer-064v-3kat.html?villa=ref-064v&amp;player=3")
          (target / (name + ".html")).write_text(html, encoding="utf-8")
          PY
      - name: Preserve only the two preview files in main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- program/share/test-064v-3kat.html program/share/test-064v-3kat.jpg program/test-viewer-064v-3kat.html program/config/test-links-064v.json program/test-media/064v.mp4
          if ! git diff --cached --quiet; then
            git commit -m 'Persist isolated 064v WhatsApp preview'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          python program/tools/prepare_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: pages-preview-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Allow artifact metadata to propagate
        run: sleep 15
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: pages-preview-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Diagnose public WhatsApp preview response
        run: |
          python - <<'PY'
          import urllib.request, urllib.error
          base = "https://3d-ev-modeli.github.io/3d-evler/program/share/"
          for agent in ("Mozilla/5.0", "WhatsApp/2.24.7.81", "facebookexternalhit/1.1"):
              for name in ("ref-064v.html", "test-064v-3kat.html", "test-064v-3kat.jpg"):
                  try:
                      req = urllib.request.Request(base+name, headers={"User-Agent":agent})
                      with urllib.request.urlopen(req, timeout=25) as response:
                          data = response.read(500000)
                          print(agent, name, response.status, response.headers.get("Content-Type"), len(data), "JPEG" if data[:2]==b"\xff\xd8" else "OG image present" if b'property="og:image"' in data else "other")
                  except Exception as exc:
                      print(agent, name, type(exc).__name__, str(exc))
          PY
