name: Programı kontrol et ve yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: portfolio-pages-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r program/tools/requirements.txt
      - name: Aktarım kodunu kontrol et
        run: python -m unittest discover -s program/tests -v
      - name: Siteyi hazırla
        run: python program/tools/prepare_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Siteyi yayınla
        id: deployment
        uses: actions/deploy-pages@v4
